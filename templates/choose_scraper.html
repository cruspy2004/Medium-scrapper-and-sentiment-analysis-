<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Scraper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000; /* Black background */
            color: #ccc; /* Light silver text */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            border: 1px solid #444; /* Silver border */
            border-radius: 10px;
            background-color: #111; /* Dark grey container */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #fff; /* White heading */
            margin-bottom: 20px;
        }
        p {
            color: #ccc; /* Silver paragraph */
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            color: #000; /* Black text */
            background-color: #ccc; /* Silver background */
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .button:hover {
            background-color: #fff; /* Bright white on hover */
            color: #000; /* Black text on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose a Scraper</h1>
        <p>Which scraper would you like to use?</p>
        <div class="buttons">
            <a href="/medium" class="button">Medium Scraper</a>
            <a href="/stackoverflow" class="button">Stack Overflow Scraper</a>
        </div>
    </div>
</body>
</html>
